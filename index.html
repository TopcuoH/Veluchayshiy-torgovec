<script>
const scrolls=[{"id": 1, "title": "Свиток 1", "pages": "29–31", "blocks": ["Сегодня я начинаю новую жизнь. Сегодня я срываю с себя прежнюю кожу, израненную и изрезанную поражениями, свойственными всякой посредственности. Сегодня я словно заново родился, а место моего рождения — виноградник, где каждый может рвать столько, сколько захочет. Сегодня я сорву виноград мудрости с самого высокого и красивого дерева, посаженного мудрейшими в моей профессии, теми, кто, поколение за поколением, приходили и уходили прежде меня. Сегодня я вкушу этот виноград мудрости, и вместе с ним в меня попадут семена успеха, и врата новой жизни раскроются предо мной. Тот путь, что я избрал, усыпан розами многочисленных возможностей, но они, в свою очередь, усеяны шипам разочарований, огорчений и даже жизней тех, кто не преуспел на этом пути. Дорогой, что я отправляюсь, уходили многие до меня, и из поверженных на ней можно сложить горы, перед которыми померкнут пирамиды. И все-таки я окажусь среди победителей, ибо в моих руках находится бесценная мудрость, которая поведет меня вперед. С ней я преодолею все преграды, пройду через безбрежные моря и океаны, достигну берегов удачи, которые еще вчера казались мне далекой мечтой. Ценой всех моих усилий станет не поражение, а победа. Отныне сама природа позаботится обо мне, тело мое не будет ведать боли, а душа — горечи поражений. Неудачи, как и боль, отныне отойдут от меня. То и другое я испытывал в своей прошлой жизни. Отныне я отвергаю их, я готов принять в себя мудрость и заповеди, которые выведут меня из мрака к свету богатства, процветания и счастья. Я достигну такого величия, что даже золотые яблоки садов Гесперид покажутся весьма скромной наградой.", "Время — лучший учитель тому, кто будет жить всегда. Мне станет известна вся людская мудрость, но я же не вечен. Но сколько бы времени мне ни было отпущено, я должен научиться искусству терпения, поскольку природа не любит торопиться. Сто лет требуется для того, чтобы оливковый росток превратился в дерево. Луковица стареет через девять недель, моя жизнь напоминала существование луковицы. Она больше не удовлетворяет меня. Отныне я превращаюсь в оливковое дерево — в величайшего из торговцев!", "Но как я всего этого достигну? Ведь у меня нет ни знаний, ни опыта, чтобы стать великим. Я невежественен и часто тону в болоте жалости к самому себе. Ответ очень прост. Я начинаю свой путь, не обремененный ненужными знаниями, на мне не лежит груз бессмысленного, никому не нужного опыта. Природа наградила меня знанием и чутьем, которому позавидовал бы любой лесной зверь, а что касается опыта, то он приходит сам собой. Да и часто его значение переоценивается, особенно стариками, которые только и могут, что глубокомысленно кивать, а как откроют рот — так уши начинают вянуть от их глупостей.", "Опыт учит многому, но одновременно пожирает годы, оттого уроки его имеют довольно незначительную ценность. Потраченные годы стоят очень дорого. Следуя этим путем, научишься многому, но только в глубокой старости. Более того, опыт подобен моде — сегодня может оказаться негодным то, что считалось великолепным вчера. Вечны только заповеди и принципы, ими я сейчас как раз обладаю. Истины, содержащиеся в словах этих свитков, поведут меня к величию. Они научат меня, как избежать поражения и добиться успеха. А успех — это состояние души. Спроси тысячу мудрецов, что такое успех, и только двое ответят одинаково. Но спроси их, что такое неудача, и одинаково ответят все: “Неудача — это неспособность человека", "достичь своих жизненных целей, какими бы они ни были, великими или малыми”. Между неудачником и человеком преуспевшим есть лишь одно отличие — разница в их привычках. Добрые привычки — ключ к любому успеху, худые привычки — наглухо закрытая дверь в будущее. Итак, наипервейшим и наиглавнейшим правилом, которому я всегда буду следовать, станет это — я выработаю в себе добрые привычки и сделаюсь их рабом. В детстве я был рабом своих порывов. Отныне я, подобно всем взрослым, раб своих привычек. Я положил себя на алтарь лет формирования привычек, поскольку вся моя прошлая жизнь грозила лишить меня будущего. Действиями моими руководит жадность, страсть, предрассудки, алчность, любовь, страх, мое окружение, дурные привычки, и самые жестокие из этих тиранов стали моими хозяевами. Но все дурное я должен отбросить немедленно, уж если быть чьим-либо рабом, то только добрых привычек. Привычки худые я должен немедленно отбросить. Для доброго семени нужно хорошо ухоженное поле.", "Итак, я сделаюсь верным рабом своих добрых привычек. Как же мне выполнить столь сложную задачу? Сделать это можно только благодаря моим свиткам, поскольку каждый из них содержит принцип, который отведет от меня дурную привычку, выкинет ее из моей жизни, а вместо нее вложит другую, ту, что приблизит меня на шажок к успеху. Закон природы состоит в том, что только новой привычкой можно подавить старую. Поэтому для того, чтобы слова этого свитка сделали свое благородное дело, я должен заставить себя выработать мою первую новую привычку, а именно: Каждый свиток я буду читать тридцать дней подряд и только после этого переходить к следующему свитку. Прежде всего, я буду читать эти слова про себя сразу, как только проснусь. Затем я прочитаю их после полудня, и тоже про себя. В последний же раз я обращусь к этим словам в конце дня, перед отходом ко сну, но на этот раз я прочитаю их вслух. На следующий день я повторю эту процедуру, и таким образом буду читать свиток в течение тридцати дней. На все это время свиток станет моим постоянным чтением, это и будет моей первой доброй привычкой. Чего же я достигну, приобретая ее? В этой привычке содержится секрет всего, что достигает человек. Ежедневно повторяя слова из свитка, я сделаю их частью своего мышления, они войдут в мою плоть и кровь. Ни в состоянии бодрствования, ни во сне — никогда они не покинут меня, и научат действовать правильно, совершать поступки, до которых бы я не додумался сам. Когда слова свитков войдут в мой таинственный второй разум, я стану просыпаться, чувствуя в себе новый прилив энергии, ранее мне неведомый. Я сделаюсь уверенным, сильным и целеустремленным. Исчезнет страх, я перестану пугаться окружающего мира. И я стану счастливее, поскольку мир уже не будет казаться мне таким опасным. В моем сердце не будет места для горечи и печали. Впоследствии, моя уверенность поведет меня вперед, я стану легко справляться с подстерегающими меня трудностями. Я буду действовать, как учат меня свитки, и вскоре эти действия станут нормой поведения. Вот я приобрел и еще одну добрую привычку, ею станет постоянно повторяющееся действие. Но оно не будет мне в тягость, а, наоборот, доставит мне удовольствие. Следовательно, и моя жизнь тоже станет удовольствием. И самое главное — часто повторяемое действие становится привычкой, а я делаюсь его рабом, но если это добрая привычка, то тогда это моя воля.", "Итак, сегодня я начинаю новую жизнь. И я торжественно клянусь себе, что никакие силы не задержат меня в моем новом развитии. Ни дня я не потеряю понапрасну, но буду читать эти мудрые строки. Ибо потерянный день невозможно возместить. Время невосполнимо. Никогда я не нарушу правило ежедневно читать эти свитки, потому что всего несколько минут чтения — очень малая цена за приобретенное", "счастье и возможность достичь успеха. Читая и перечитывая эти мудрые слова, коим мне надлежит следовать, я никогда не усомнюсь в их глубине, ибо сколь просты они ни были, они говорят о самом важном и сокровенном. Винодел давит тысячи виноградных гроздей и получает всего один кувшин прекрасного вина, выбрасывая виноградную кожуру и зерна птицам. Передо мной вино мудрости, выдержанное веками. Многое отсеялось и развеялось по ветру. В словах свитков содержится неопровержимая истина. Я буду пить вино мудрости, не пролив ни капли, а вместе с ним в меня войдут семена успеха. Сегодня моя старая кожа превратилась в пыль. Я пойду, высоко подняв голову, и люди не узнают меня, поскольку я стал другим человеком. Я начал новую жизнь."], "sha256": "41b0c9a47a1b0676f95cac24d99debdf5dd45f6c240da93a7dcd79bc99255acc"}, {"id": 2, "title": "Свиток 2", "pages": "32–33", "blocks": ["С любовью в сердце я встречу этот день. Теперь я знаю великую тайну — как достичь успеха во всем, что бы ни задумал. Мои мышцы крепки как сталь. Если я захочу, я пробью даже щит. Я могу изменить свою жизнь, но есть только одна сила, способная раскрыть сердца людей — это любовь. И пока я не научусь этому искусству, я буду ничем не лучше рыночного носильщика. Я сделаю любовь самым грозным оружием, и тогда ни один из тех, к кому я буду обращаться, не устоит против меня. На каждый мой аргумент они могут ответить своим, моим убеждениям они могут не поверить. Мою правду они могут подвергнуть осмеянию, им даже может не понравиться моя внешность. Даже мою сговорчивость они могут неправильно истолковать. То есть, все, что бы я ни сказал и ни сделал, может вызвать у них подозрения. И только моя любовь, подобно жарким солнечным лучам, под которыми тает самая холодная глина, растопит их сердца.", "С любовью в сердце я встречу этот день. Как мне достигнуть этой любви? Очень просто. Отныне я на все, окружающее меня, буду смотреть с любовью, я словно возродился заново. Я возлюблю солнце за ту теплоту, которой оно согревает меня. Но в равной степени я возлюблю и дождь, за то, что он смывает с меня горечь и хмурые мысли. Я возлюблю свет, что освещает мой путь, и темноту, ибо только тогда я вижу звезды. Я буду приветствовать счастье, поскольку оно делает меня лучше, но я восприму и печаль, поскольку она позволяет мне глубже понять свою душу. Каждую награду я буду воспринимать как должное, а каждое препятствие — как вызов, брошенный судьбой. Первое я приму с радостью, второе — преодолею. И все, что бы я ни делал, я буду делать в радости и любви.", "С любовью в сердце я встречу этот день. Изменится даже моя речь. Я буду превозносить моих врагов, и они станут моими друзьями, я буду хвалить моих друзей, и они станут мне братьями. Всегда и во всем я буду искать причину для похвалы. И никогда я не унижусь до сплетен. Я сам откушу себе язык, прежде чем позволю себе сказать о ком-нибудь плохо. А если мне захочется кого-нибудь похвалить, я буду кричать хвалебные слова со всех крыш. Точно так же и птицы, и ветер, море и вся природа во весь голос поют слова благодарности своему создателю. Мы слышим эту музыку, и сердца наши радуются. Разве я не могу говорить так, чтобы мои слова стали музыкой в ушах его детей? Отныне я навсегда запомню этот секрет, и он изменит мою жизнь.", "И с любовью в сердце я встречу этот день. Каковы же будут мои действия? Я буду любить людей независимо от их поступков, потому как у каждого есть положительные качества, только было бы желание их разглядеть. Но я буду очень внимателен. С любовью в сердце я разорву завесу подозрения и ненависти, заслоняющую их сердца. Я выстрою мосты к их душам и наполню своей любовью. Я буду любить свои честолюбивые устремления за то, что они вдохновляют меня. Но я возлюблю и свои неудачи, поскольку они учат меня. Я стану любить владык — ведь они такие же люди. Я возлюблю убогих и больных, поскольку их удел — святость. Я возлюблю богатых за то, что многие из них", "одиноки. Я возлюблю бедных — ведь их так много на нашей земле. Я возлюблю молодых за их веру, а стариков за их мудрость. Я возлюблю красивых за их печальные глаза, а уродливых за их умиротворенные души.", "И с любовью в сердце я встречу этот день. Но как я буду реагировать на действия других? С любовью. Любовь — это не только мое оружие, которым я раскрываю сердца. Любовь — это мой щит, с помощью которого я отражаю стрелы ненависти и копья злобы. Я отражу своим прекрасным щитом сомнения и неудачи. Мой щит оградит меня в торговых делах и поддержит в часы одиночества. В моменты горьких раздумий он утешит меня и успокоит. Со временем он станет еще сильнее и надежнее. Но однажды я отброшу его и без страха выйду к людям. И когда я сделаю это, имя мое возвысится на пирамиде жизни.", "И с любовью в сердце я встречу этот день. И как же я стану обращаться к людям? Для этого есть только один способ — обратившись к кому-нибудь произносить в душе слова: “Я люблю тебя”. Неслышимые для уха, эти слова отразятся в моих глазах и ласковой улыбке. А мое отношение передастся тому, к кому я обращаюсь. И разве сможет кто-нибудь устоять и отказаться от моего товара, предложенного с любовью?", "И с любовью в сердце я встречу этот день. Но более всего я возлюблю самого себя. Любовь позволит мне зорко следить за всем, что стремится в мою душу, в мой разум и сердце. Я стану умерен во всем, что касается моей плоти, я буду держать тело свое и душу в чистоте. Никогда глаза мои не прельстятся дурным, никогда я не предамся отчаянию. На все, что меня окружает, я буду смотреть глазами усвоенной мною вековой мудрости. И никогда я не позволю сердцу своему и душе своей ожесточиться или стать бесчувственными. Размышления и молитва станут моей основной пищей, и ни горечь, ни самовлюбленность никогда не проникнут в мое сердце и душу. И пусть лучше разорвется мое сердце, чем станет глухим к чужим страданиям.", "И с любовью в сердце я встречу этот день. Отныне я возлюблю всех людей. Ненависть отойдет от меня и мной овладеет только любовь. У меня не будет времени ни злиться, ни сокрушаться, все мое время будет отдано любви. Сегодня я делаю первый шаг на пути, перемещаясь по которому я стану человеком среди людей. Любовь увеличит мой доход в сотни и тысячи раз, и я сделаюсь величайшим торговцем в мире. Нет у меня других достоинств, кроме любви к людям и я воспользуюсь ею. Без любви все мои начинания потерпят крах, в любви все мои замыслы, даже самые честолюбивые, станут реальностью. Любовь — самое великое знание и умение. Владеющему ею все становится доступным.", "С любовью в сердце я встречу этот день, и он принесет мне успех."], "sha256": "d77aef96e181388b3ed9fe0079e073e1ecd272f62a013c85cedf02ede3275c95"}, {"id": 3, "title": "Свиток 3", "pages": "34–35", "blocks": ["Я буду настойчив в достижении успеха. На Востоке пригодность молодых быков сражаться на арене проверяется таким образом: быка вводят в круг и пикадор покалывает его копьем. Смелость быка определяется количеством его атак на пикадора. Если же он пугается острия копья и уходит от пикадора, то такой бык считается трусливым. Отныне и я стану считать, что каждый день жизнь испытывает меня на стойкость и смелость. Если я буду настойчив в своих стремлениях и смел, если я буду постоянно стремиться вперед, то обязательно добьюсь успеха.", "И я буду настойчив в достижении успеха. Я пришел в этот мир не для того, чтобы терпеть поражения. В моих жилах течет кровь победителя, а не неудачника. Я не овца, терпеливо ожидающая, когда щелкнет кнут пастуха. Я лев! Я отказываюсь ходить в овечьей отаре. Я не стану слушать жалобное блеяние. Болезнь неудачников заразительна. Им место в стаде. Бойня поражений — не для меня. Моя судьба совершенно иная.", "И я буду настойчив в достижении успеха. Подарки судьбы находятся не в начале, а в конце любого путешествия. Мне не дано знать, сколько ступенек я должен пройти, чтобы достичь своих целей. И я всегда могу столкнуться с неудачей, даже на тысячной ступеньке. Однако успех лежит впереди, прячется за ближайшим поворотом. Но я никогда не увижу его, если не найду в себе смелость преодолеть неудачу и заставить себя дойти до этого поворота. Ничто не остановит меня перед вторым шагом. И если он не принесет мне успеха, я сделаю следующий шаг. Ничто не остановит меня. И мне будет совсем не трудно идти.", "И я буду настойчив в достижении успеха. Отныне, я буду считать себя дровосеком, и каждое мое усилие в достижении успеха — это удар моего топора по стволу могучего дуба, который я должен срубить. Первый удар отколет от ствола лишь маленькую щепочку, столь же малоэффективными будут второй и третий удары. Сам по себе, удар — это мелочь, однако, после того, как я нанесу многие тысячи ударов, дуб рухнет. И наносить удары я начну сегодня.", "Я буду подобен дождевой капле, разрушающей горы, муравью, пожирающему тигра, звезде, освещающей землю, рабу, возводящему пирамиду. Камень за камнем, кирпич за кирпичом, — так постепенно я стану возводить свой замок. Сколь ни малы будут усилия и попытки, их количество перерастет в качество, и в конечном счете, я стану победителем.", "И я буду настойчив в достижении успеха. Я никогда не буду думать о возможных поражениях, из моей речи исчезнут такие слова, как: сдаваться, не могу, не способен, невозможно, невероятно, нет сил, неудача, неэффективный, безнадежный, отступление. Пусть они “украшают” речь дураков. И я не буду предаваться отчаянию. А если эта зараза все-таки проникнет в меня, я буду работать и в отчаянии. Я стану трудиться, и выдержу любые испытания. Я буду больше думать не о препятствиях, стоящих передо мной, а о сверкающей впереди цели. Я — путник, бредущий по пустыне, за которой лежит прекрасная страна с вечнозелеными деревьями и с весело", "журчащими ручейками.", "И я буду настойчив в достижении успеха. Я буду всегда помнить древний закон средних чисел и обращу его в свою пользу. Я буду всегда помнить, что каждая крупица знаний, полученная при попытке продать товар, увеличивает мои шансы добиться успеха. Каждое услышанное мною “нет” приближает меня к заветному “да”. Каждое встреченное мной недовольство ведет меня к радостной улыбке. Каждая встреченная мной неудача несет в себе семена будущего успеха. Ночь всегда сменяется днем, и я должен видеть ночь, чтобы оценить день. Я обязан претерпеть множество неудач, чтобы раз и навсегда достичь успеха.", "И я буду настойчив в достижении успеха. Я никогда не остановлюсь, но постоянно буду искать и пытаться. И я не буду избегать препятствий — чем больше их будет на моем пути, тем лучше. Они лишь закалят меня.", "Я буду настойчив, я буду совершенствовать свое мастерство, как делает это моряк, ведущий свой корабль сквозь бушующий океан.", "И я буду настойчив в достижении успеха. Отныне я буду учиться и применять секреты тех, кто знает мою работу лучше меня. В конце дня, независимо от того, был ли он для меня успешным, или нет, я попытаюсь совершить еще одну сделку. Когда в сердце мое станут заползать сомнения, я буду гнать их, и я снова буду пытаться. Я сделаю еще одну попытку приблизить победу, а если и она кончится ничем, я сделаю еще одну, а затем еще, и еще. Я не допущу, чтобы день мой кончался неудачно. Только так я смогу взрастить семя завтрашнего успеха и превзойти тех, кто склонил голову под бременем неудач. Там, где остальные беспомощно опускают руки, я продолжу свою битву, и такое упорство приведет меня к цели.", "И я буду настойчив в достижении успеха. Но никогда временный успех не заставит меня ослабить усилия, поскольку это залог будущего поражения. Я буду забывать события прошедшего дня, неважно, какими они были — хорошими или плохими. Каждый новый день я встречу уверенный в том, что это будет мой лучший день.", "Пока я дышу, я буду настойчив. Отныне мне известен один из самых главных принципов успеха — чем сильней мое упорство, тем вернее победа.", "Я буду настойчив. И я достигну успеха!"], "sha256": "859af245eef48fec06bb59b3459cf70047bf2c09cfe3c8ac1e7fe39404e5c327"}, {"id": 4, "title": "Свиток 4", "pages": "36–37", "blocks": ["Сотворив меня, природа совершила величайшее из всех чудес. Со времен сотворения мира не рождался еще человек с такими же, как у меня разумом, сердцем, глазами, ушами, руками, волосами и ртом. Ни у кого из живущих и ни у кого, кто родится завтра, не будет той же, что у меня, походки, такой же манеры разговаривать и думать. Все люди — мои братья, но я — уникален.", "Я — величайшее из чудес, сотворенных природой. Я принадлежу к животному миру, но не довольствуюсь наградой, которую получают животные. Внутри меня горит огонь, который передавался из поколения в поколение, и жар его постоянно побуждает меня к действию. Дух мой мятежен, а взгляд решителен, я должен стать лучше, чем есть сейчас, и стану таким. Огонь сомнений и недовольства временными неудачами я залью, и докажу миру свою уникальность. Никто не может повторить моих детей, действий, мыслей, почерка. И никто не может продавать так, как я. Отныне свою уникальность я обращу себе на пользу, она станет моим главным достоинством и приведет к победе.", "Я — величайшее из чудес, сотворенных природой. Я не буду делать попыток повторить действия других. Вместо этого я выставлю на продажу не только свой товар, но и свою уникальность. И только тогда я преуспею в торговле. Отныне я буду выставлять напоказ свою индивидуальность и глубоко спрячу то, что делает меня похожим на других. И товары, что я продаю, будут нести на себе отпечаток моей уникальности. Каждый торговец должен быть горд своей уникальностью, и это чувство передастся его товару.", "Я — величайшее из чудес, сотворенных природой. Я — уникум, но у каждого уникума есть цена. Она очень высока, следовательно, и я сам дорого стою. Я — конечный продукт тысячелетий эволюции, поэтому я впитал в себя и разум и силу поколений императоров-мудрецов, предшествовавших мне. Но и разум мой, и мое сердце, тело и умение превратятся в пыль, если я не буду их использовать. Мой потенциал неограничен. Я использую всего лишь малую толику своего мозга и мышц. Отныне я постараюсь максимально использовать свои возможности, и все мои начинания увенчаются успехом. И начну я это делать не завтра, а сегодня. Но как бы успешен не был для меня мой завтрашний день, я не остановлюсь на достигнутом, и тем более, не стану превозносить себя. Мои начальные успехи — мелочь, я обязан идти вперед, чтобы достичь большего. И я достигну всего, что задумал, ибо зачем тогда природе трудиться, создавая меня. Являясь одним из чудес природы, я должен перенести ее величие на свои дела.", "Я — величайшее из чудес, сотворенных природой. Я не случайно пришел в этот мир, я нахожусь здесь с определенной целью — стать горой, а не превратиться в песок. Отныне все мои силы будут брошены на достижение этой цели. Я буду работать, не щадя себя.", "Я буду постоянно изучать и людей, и себя, и те товары, что я продаю, и тем самым, улучшу свою торговлю. Продавая свои товары, я буду красноречив, каждое мое слово будет обдуманно и", "отточено, поскольку моя речь — это фундамент, на котором я строю свою карьеру. Я никогда не буду забывать о том, что основным средством для достижения успеха в торговле служит манера говорить. Многие торговцы достигли богатства, имея в своем активе лишь одно умение — прекрасно поставленную речь. Я всегда буду помнить, что в торговых делах большое значение имеют мои манеры и жесты, и чем они красивее и благороднее, тем приятнее для глаз покупателя.", "Я — величайшее из чудес, сотворенных природой. Я полностью сконцентрируюсь на моих сегодняшних задачах, забывая про все ненужное. Все свои домашние заботы я оставлю дома. Находясь в своей лавке, я не буду думать о своей семье, ибо мысли эти помешают моей работе. Возвратившись же домой, я не буду думать о своей работе — все неприятности или успехи, связанные с ней, я оставлю в лавке. Никакие неприятности на работе не уменьшат мою любовь к семье, но успехи же только углубят ее. Когда я нахожусь на работе, в душе моей не будет места для моей семьи, но возвращаясь домой, я не внесу в него ни одной мысли о моей работе. С самого начала я отделю работу от дома, но это лишь крепче свяжет меня с ними. Работа должна быть отделена от домашних забот, иначе мне никогда не сделать карьеры. Таков парадокс жизни, но это непреложный закон.", "Я — величайшее из чудес, сотворенных природой. Мне даны глаза, чтобы видеть, и разум, чтобы думать. Теперь я знаю великую тайну жизни — я наконец-то понял, что все мои проблемы, разочарования и беды, по сути, являются полем для приложения моих возможностей. Мои глаза больше не обманутся их одеждами, ибо я научился видеть. Отныне я способен вглядываться в суть вещей, и меня уже не обманет внешность.", "Я — величайшее из чудес, сотворенных природой. От животных, растений, ветра, дождя, скалы или озера я отличаюсь тем, что, порожденный любовью, появился на свет с определенной целью. До сегодняшнего дня этот факт оставался для меня тайной, но отныне я буду всегда помнить его, и он придаст смысл моей жизни и поведет меня вперед.", "Я — величайшее из чудес, сотворенных природой. А природа не знает поражений. Природа всегда одерживает победу, следовательно, и я обязан победить. И каждая моя победа сделает следующую битву не такой тяжелой, как предыдущая. Я обязательно одержу верх и стану великим торговцем, поскольку я уникален.", "Я — величайшее из чудес, сотворенных природой."], "sha256": "4da26ecba12ed0479175a7ec2f920da1942124a9b83e93e51265910d9d41da25"}, {"id": 5, "title": "Свиток 5", "pages": "38–39", "blocks": ["Я проживу этот день так, словно он — мой последний. А что я буду делать в этот драгоценный последний мой день? Прежде всего, я постараюсь, чтобы ни одна капля моей жизни не ушла в песок. Ни секунды я не буду сокрушаться о сделанном вчера. Меня не тронут вчерашние неудачи, поражения, вчерашние боли и расстройства. Почему я должен думать о вчерашнем плохом, если сегодня могу сделать много доброго? Может ли песок в часах течь вверх? Может ли солнце вставать на западе, а садиться на востоке? Нет. Так и я не могу исправить сегодня ошибки, сделанные вчера. И могу ли я сегодня, снова переживая вчерашнюю боль, залечить ее? И способен ли я сегодня стать моложе, чем был вчера? Нет, мне не дано вернуть вчерашний день. Я не могу ни исправить свои вчерашние недобрые поступки, ни залечить боль, причиненную мне. Вчерашний день навсегда погребен, и я не стану о нем думать.", "И я проживу этот день так, словно он — мой последний. И что же я буду делать сегодня? Прежде всего, забыв о вчерашнем дне, я не буду думать о дне завтрашнем. Разумно ли вычеркивать из своей жизни сегодня ради призрачного завтра? Завтрашний день принадлежит будущему, и песок завтрашних часов не станет сыпаться сегодня. Или солнце взойдет сегодня дважды? Нет, конечно. Сегодня мне не сделать завтрашних дел. Золото завтрашнего дня не положишь в кошелек сегодня, и ребенок, которому суждено родиться завтра, сегодня еще не появится на свет. И завтрашняя смерть еще не распростерла своих крыльев над сегодняшним днем. Так какая польза будет от того, если я начну горевать? Зачем беспричинно омрачать сегодняшние радости? Какой смысл мучить себя вопросами, которые, может быть, никогда и не встанут на моем пути? Нет, я не стану думать ни о вчерашнем, ни о завтрашнем дне.", "Я проживу этот день так, словно он — мой последний. Этот день — все, что у меня осталось, и сегодня я встречу рассвет с радостью приговоренного к смерти, которому дали пожить еще немного. Воздев руки к небу, я возблагодарю Всевышнего за тот бесценный дар, коим для меня является сегодняшний день. Скорбеть я буду лишь о тех, кому не суждено увидеть сегодняшний рассвет. Я стану считать себя счастливейшим человеком, поскольку мне дарован еще один день жизни, который я, возможно, по поступкам своим и не заслужил. И я задумаюсь над тем, почему именно мне разрешено жить, тогда как другие, возможно, более достойные, ушли? Может быть потому, что они достигли своих целей, тогда как мне еще предстоит долго идти? Может быть этот день — еще одна возможность, данная мне, чтобы стать тем, кем я хочу? Тогда, выходит, я выполняю волю природы? И, возможно, именно сегодня я достигну своей цели или максимально приближусь к ней?", "Я проживу этот день так, словно он — мой последний. Жизнь у меня всего одна, но жизнь — всего лишь мера времени. Если я растрачиваю одно, значит, я растрачиваю и другое. Вычеркнув из своей жизни сегодня, я вырву из своей жизни последнюю страницу. О нет! Каждый час сегодняшнего дня я наполню делами, ибо сегодня невозвратимо. Глупо бездельничать, оставлять дела на завтра, если не уверен, наступит ли оно", "для тебя. Я буду любить каждую минуту, каждую секунду сегодняшнего дня, ибо они бесценны. Ни за какие деньги мира не купишь лишний вдох. И если у меня не будет завтра, то, следовательно, каждый час моей сегодняшней жизни я должен наполнить бесценным содержанием.", "Я проживу этот день так, словно он — мой последний. Я стану сторониться бездельников, тех, кто убивает время. Ни в чем я не стану медлить, промедление я убью делом. Сомнения я разрушу верой, а страх — уверенностью в себе. Я не буду слушать бессмысленные речи болтунов, я отойду от тех, чьи руки не заняты работой, обойду дома, живущих в праздности и лени. Ленивый подобен вору, он крадет у своих любимых пищу, одежду и кров. Я — не вор, я люблю своих родных и близких, поэтому и сегодняшний день наполню делами, докажу всем, что даже в самый тяжелый час могу, не теряя присутствия духа, заботиться о своих любимых.", "Я проживу этот день так, словно он — мой последний. То, что мне надлежит сделать сегодня, я сделаю именно сегодня. Сегодня я буду любить своих детей, ибо кто знает, что нам несет завтра? Сегодня я покрою поцелуями лицо моей прекрасной жены, ибо никто не знает, что нам сулит завтра. Сегодня я помогу другу, поддержу его в беде, ибо не в моей власти знать, встречусь ли я с ним завтра. А если горе постигнет меня, то кто, если не верный друг поможет мне? И если он нуждается в помощи сегодня, я не имею права отказать ему. Сегодня я буду напряженно работать, жертвовать собой ради других, ибо завтра для меня потеряно.", "Я проживу этот день так, словно он — мой последний. И если сегодня — мой последний день, то своими сегодняшними делами я воздвигну себе памятник. Я сделаю сегодняшний день лучшим в своей жизни. Данную мне сегодня чашу жизни я выпью до последней капли. Каждый драгоценный час, каждая минута сегодняшнего дня будут наполнены такими же бесценными делами. Не жалея себя, я буду работать еще упорнее, чем вчера и позавчера. Мой удел — торговля, и я ни минуты не стану сидеть без дела, я буду стучаться, предлагать свой товар и добьюсь большего, чем обычно. И каждая секунда дня сегодняшнего станет еще более продуктивной. Мой последний день должен стать моим лучшим днем.", "Я проживу этот день так, словно он — мой последний. А если и завтра мне будет дарован еще один рассвет, я с радостью возблагодарю за него Всевышнего."], "sha256": "ffbc47ce9145b90ff37d32f8074a9a877178769403564c0d16a653b77cf01024"}, {"id": 6, "title": "Свиток 6", "pages": "40–41", "blocks": ["Сегодня я научусь властвовать собой и стану хозяином своих эмоций. После прилива следует отлив. Зима отступает и приходит лето. А затем снова приходит зима и приносит с собой холода. Каждый день встает и заходит солнце. Прилетают и улетают птицы. Распускаются и увядают цветы. Брошенные в землю зерна дают всходы. Вся природа — это замкнутый круг смены настроений, а поскольку и я часть природы, то и мое настроение может и повышаться, и понижаться. Оно словно волна — то поднимается, то падает.", "Но сегодня я стану хозяином своих эмоций. Одна из самых непонятных загадок природы состоит в том, что просыпаюсь я совсем с другим настроением, чем ложился. Почему? Почему от вчерашних радостей не остается и следа? Отчего вчерашний подъем сменился унынием? Но возможен и обратный процесс. Сегодняшняя печаль завтра сменится весельем. Почему так происходит? Потому что во мне постоянно крутится колесо эмоций. Печаль сменяется радостью, которая может переходить в экзальтацию. Однако после него может следовать печаль. Неистовая радость может смениться внезапной меланхолией. Мои эмоции подобны цветам: сегодня они распускаются от радости, а завтра увядают с печалью. И в то же время я знаю, что увядшие цветы сегодняшней тревоги несут в себе семена завтрашнего счастья.", "Сегодня я стану хозяином своих эмоций. Но как я буду властвовать над своими эмоциями? Как мне управлять ими так, чтобы мой день был более продуктивен? Если я не справлюсь с задачей и мое настроение упадет, то день кончится неудачей. Рост деревьев и трав зависит от погоды, греет солнце — они цветут, подул холодный ветерок, и они увяли. Я сам стану создавать себе погоду. Если я принесу себе дождь и ночь, то тем самым введу себя в уныние, мрачный пессимизм, и это отразится на моей торговле. Если же я буду встречать своих покупателей с радостной улыбкой, мое жизнерадостное веселье передастся им. От моей погоды, моего настроения, зависит и мой урожай — проданные товары, превращенные в золото.", "Сегодня я стану хозяином своих эмоций. А как я смогу укротить свои эмоции, управлять ими так, чтобы каждый мой день стал счастливым, а работа — продуктивной? Для этого мне предстоит узнать тайну веков: тот слаб, кто позволяет своим мыслям властвовать над своими делами; сильным же считается тот, кто своими делами властвует над своими мыслями. Каждый день, просыпаясь утром, прежде чем впасть в уныние, прежде чем начать сокрушаться о своей судьбе и таким образом готовить себе очередную неудачу, я буду следовать определенному плану.", "• Если я почувствую, что опечален — я запою.", "• Если пришла в сердце горечь — я засмеюсь.", "• Если почувствую недомогание — стану работать с удвоенным усердием.", "• Если почувствую страх — брошусь вперед.", "• Если почувствую в себе неуверенность — заставлю себя говорить громче.", "• Если почувствую, что беден — вспомню об ожидающем меня впереди богатстве.", "• Если почувствую, что мне не хватает знаний — вспомню прошлые успехи.", "• Если почувствую себя ничтожным — вспомню свои цели.", "Сегодня я стану хозяином своих эмоций. Отныне я буду знать, что победителями способны стать только те, кто обладает внутренней волей измениться даже внешне. Многие дни мне придется бороться с силами, разрывающими меня, среди которых будут и печаль, и горечь. Узнать их легко, но есть и другие отрицательные эмоции, которые прячутся за сладкими улыбками. Они похожи на друзей, протягивающих вам руку помощи, но тянут они вниз, к неудачникам. Но и против таких сил у меня есть противоядие.", "• Если я почувствую, что излишне возгордился — вспомню о своих неудачах. • Если я начну купаться в роскоши — вспомню о бедных. • Если я захочу покоя — вспомню о своих конкурентах. • Если меня ослепит блеск временного успеха — вспомню о былых неудачах. • Если мне покажется, что я стал могучим — попытаюсь остановить ветер. • Если я почувствую себя богаче всех — вспомню, сколько голодных я смог бы накормить. • Если меня станет обуревать гордыня — вспомню то время, когда был слаб и беспомощен. • Если мне покажется, что я достиг блестящего положения — я посмотрю на звезды. Сегодня я стану хозяином своих эмоций. Обогащенный этими знаниями, я смогу определить настроение того, кто приходит ко мне. Я пойму его негодование, ведь он не знает тайны, что известна мне. Тот, кто пришел ко мне не может контролировать свои эмоции, но зато я умею контролировать свои. Мне не составит труда отбить стрелы зла и оскорблений, поскольку я уверен — завтра, тот, кто пришел ко мне, станет лучше. Я не буду судить о человеке по первому впечатлению. Тот, кто пришел ко мне сегодня злым, не услышит от меня ни слова упрека, ведь завтра он придет добрым. И если сегодня он не купил и колесницы за полушку, то завтра он охотно купит саженец за целый кошелек золота. Знание настроений, умение управлять своими эмоциями — ключ к богатству.", "Сегодня я стану хозяином своих эмоций. Отныне я способен угадывать настроения, ибо я знаю тайну, как это делать. Я могу определить не только свое настроение, но и всего человечества. И отныне я готов управлять своим внутренним “я”, управлять добрыми делами, а умение управлять настроением равносильно умению управлять судьбой. С сегодняшнего дня я начинаю управлять своей судьбой и стану величайшим торговцем в мире!", "Я стану хозяином своих эмоций. И я стану великим."], "sha256": "5d53e03e3e0b9b916c08c01abd60dd01ed1fdcf715dabf72094c4f783030330d"}, {"id": 7, "title": "Свиток 7", "pages": "42–43", "blocks": ["Я посмеюсь над миром. Ни одно живое существо, кроме человека, не может смеяться. Если дерево поранят, оно плачет, звери кричат от голода и страха, и только я могу смеяться, когда захочу. Отныне я буду всегда только смеяться.", "Я буду смеяться и стану сильнее и здоровее. Я буду смеяться, и мое бремя станет легче. Я буду смеяться, и моя жизнь станет лучше. Я буду смеяться и проживу дольше. Смех — ключ к долголетию, и отныне он в моих руках.", "Я посмеюсь над миром. Но больше всего я посмеюсь над самим собой, ибо нет ничего комичнее человека, который слишком серьезно смотрит на себя. Я не попадусь в ловушки, которые расставляет мне разум. Несмотря на то, что я — самое совершенное из всех чудес природы, я всего лишь травинка, пригибаемая к земле ветром времени. Знаю ли я, откуда пришел и куда направляюсь? Не будут ли мои сегодняшние заботы через десять лет казаться смешными? Стоит ли мне так расстраиваться из-за нелепостей и несчастий сегодняшнего дня? Кто знает, что может случиться, прежде чем зайдет солнце? Что значат мои мелкие заботы по сравнению с океаном веков?", "Я посмеюсь над миром. Но как я могу смеяться, если вижу перед собой человека, который так и стремится вывести меня из себя? Отныне, как только я почувствую, что хорошее настроение начинает покидать меня, я буду мысленно повторять про себя два заветных слова. Их донесли до меня века, и теперь они поведут меня вперед, сделают меня уравновешенным, а мою жизнь — безмятежной. Вот эти слова: все проходит.", "И я посмеюсь над миром. Все мирское и суетное проходит. Если я заболею, я утешу себя, вспомнив, что и болезнь тоже проходит. Достигнув успеха и возгордившись, я напомню себе, что проходит и успех. Богатство не обременит меня, ибо проходит и богатство. Где тот, кто возвел пирамиды? Не лежит ли и он, погребенный под камнем? А сами пирамиды? Не превратятся ли и они когда- нибудь в груду песка? И если все проходит, так ли уж велики сложности и непреодолимы преграды сегодняшнего дня?", "Я посмеюсь над миром. Не белой или черной краской, но своим смехом я окрашу этот день. А ночь я свяжу своей песней. Я стану упорно работать, но не для того, чтобы быть счастливым, а для того, чтобы отогнать от себя печаль. Сегодняшними радостями я воспользуюсь сегодня. Радость — не вино, его не сохранишь в кувшине. Оно и не хлеб, его не сохранишь в амбаре. Радость — это то, что потребляется сразу, в тот же день, когда она появилась. Поэтому с сегодняшнего дня я буду сразу же пожинать плоды радости.", "И я посмеюсь над миром. Смех мой поможет мне увидеть все в правильном свете — большое сделается большим, а малое — малым. Я посмеюсь над своими неудачами, и они растают, словно утренняя дымка. Я посмеюсь над своими достижениями, и они уменьшатся до своих реальных размеров. Я посмеюсь над злом, и оно исчезнет, не коснувшись меня. Я посмеюсь над добром, и оно, увеличившись в размере, окутает меня. Но каждый день станет моим великим днем только тогда, когда моя улыбка отразится на лицах других. И я не перестану улыбаться и ни от кого не буду скрывать свою улыбку, ибо печаль опустошает кошелек, а радость — помогает наполнять его золотом.", "Я посмеюсь над миром. Отныне я не пролью ни единой слезинки: печаль, горечь или сожаление — не для торговца. Только свою радость и улыбку он может обменять на золото, но не слезы. И каждое его доброе слово — это еще один кирпичик в строительстве дворца его благополучия. Никогда я не возгоржусь своим богатством, величием, знатностью или могуществом, поскольку от этого теряется способность смеяться над собой и над миром. Я буду всегда подобен ребенку, который, улыбаясь, смотрит на всех снизу вверх. А пока я смотрю на всех снизу вверх, мне еще очень и очень далеко до величия.", "Я посмеюсь над миром. И покуда я буду способен смеяться, я не обеднею. Смех — величайший дар природы, и я не растеряю его. Смех и счастье — соседи, они ходят рука об руку. Смех принесет мне счастье и успех, поможет мне насладиться плодами моего труда. Если я перестану смеяться, то счастье уйдет от меня, и я стану неудачником. Счастье — это вино, украшающее вкус пищи. Чтобы насладиться успехом, я должен быть счастлив, а счастье принесет мне мой верный слуга — смех.", "Я буду счастлив. Только тогда успех ждет меня. И я стану величайшим торговцем в мире."], "sha256": "2ccfcd6d55c0d5fea780b31f25366c97f80e58947e5315fadc2e0443c2db0a1c"}, {"id": 8, "title": "Свиток 8", "pages": "44–45", "blocks": ["Сегодня я увеличу свою ценность в сотню раз. Человеческий гений превращает тутовое дерево в шелк. Человеческий гений превращает глину в грозный замок. Человеческий гений превращает кипарисовое дерево в храм. Человеческий гений превращает прядь овечьей шерсти в царские одежды. И если глина и лист, шерсть и дерево могут увеличиваться в своей ценности, то разве не могу сделать того же и я?", "Сегодня я увеличу свою ценность в сотню раз. Я подобен пшеничному зерну, которое ждут три участи. Первая — его положат в амбар и затем скормят свиньям. Вторая — перемелют в муку и сделают из него хлеб. И третья — бросят в землю, и из него взойдет золотистый колос, который даст сотни таких же драгоценных зерен. Я — подобен пшеничному зерну, но с одной лишь разницей — зерно не может выбирать свою судьбу. Его владелец решает за него, что сделать с ним — скормить ли свиньям, испечь ли хлеб, или взрастить новые зерна. Я имею право выбора и не хочу, чтобы моя жизнь была брошена под ноги свиньям. Но равно не хочу я быть выброшенным в землю, ибо это может быть каменистая почва неудач и поражений. Нет, я не желаю зависеть от воли других.", "Сегодня я увеличу свою ценность в сотню раз. Чтобы расти и дать всходы, зерно должно быть посажено в темноту, в землю. Так же и мои неудачи, мое отчаяние, мое невежество и неспособность — та же темнота, куда меня бросили и где я должен дать свои всходы. И, подобно пшеничному зерну, нуждающемуся в дожде, солнце и теплом ветре, мое тело и разум нуждаются в уходе, ибо без него мне не выполнить моей задачи. Однако рост пшеничного зерна зависит от внешних условий. Я же не могу ждать, пока кто-то сделает что-нибудь для меня. Я сам способен изменить свою судьбу.", "Сегодня я увеличу свою ценность в сотню раз. Но как я это сделаю? Прежде всего, каждый день я буду ставить себе маленькие цели и буду добиваться их. Сначала я буду строить планы на день, затем — на неделю, потом — на месяц, а затем и на более долгие сроки — на год и на всю жизнь. Еще до того как пшеничное зерно лопается, его должен оросить дождь. Так и я буду ставить себе цели и выполнять их прежде чем достигну того возраста, когда раскроются все мои способности. Определяя цели, я буду разумно оценивать свои теперешние способности, и, учитывая свой прошлый опыт, улучшу их в сотни раз. Отныне это правило станет для меня эталоном моего поведения на будущее. И никогда я не усомнюсь в том, что способен достичь поставленной цели. Уж лучше я нацелю свое копье в луну, но попаду в орла, чем, целясь в орла, попаду в камень.", "Сегодня я увеличу свою ценность в сотню раз. Величие моих планов не испугает и не заставит меня отступить. Меня не остановит даже то, что, идя к своей цели, я не раз споткнусь и упаду. Не падает только земляной червь, чей удел — ползать. Меня же падения не напугают, я встану и с утроенной энергией двинусь навстречу своей мечте. Я — не червь, не луковица, чья жизнь зависит от погоды, и не овца. Я — человек. Пусть другие строят себе хрупкие жилища из глины, я хочу жить в замке, и моя задача — добыть", "для него камни.", "Сегодня я увеличу свою ценность в сотню раз. Слова древней мудрости этих свитков будут согревать мою жизнь подобно солнцу, прогревающему землю и дающему жизнь пшеничному зерну. Содержащиеся в свитках заповеди помогут мне превратить мои мечты в реальность. Сегодня одно мое дело будет равняться десятку вчерашних. Чего бы мне это ни стоило, я буду карабкаться на вершину моих сегодняшних устремлений. И если вершина не покорится мне сегодня, то завтрашнюю вершину я обязательно одолею. А следующая вершина будет еще выше завтрашней, но и она мне тоже покорится. Отныне для меня важно не превзойти других, а каждый день превосходить себя.", "Сегодня я увеличу свою ценность в сотню раз. И тот же ветер, что помогает семенам пшеницы вызревать, донесет до всех мой голос, когда я буду говорить о своих целях. Но, провозгласив свои цели, я уже не оступлюсь от них, ибо в этом случае я потеряю лицо. Я стану пророком, и сквозь мой смех люди услышат мои слова, узнают о моих планах и мечтах, и тогда мне не будет иного пути, кроме как выполнять задуманное. Только тогда мои мечты смогут превратиться в реальность.", "Сегодня я увеличу свою ценность в сотню раз. Если мои цели будут не столь высоки это не беда. Я буду упорно работать, и неудачи отойдут от меня. Но никогда я не буду доволен достигнутым, поскольку знаю, что могу сделать еще больше. Достигнув малого, я тут же поставлю себе еще более высокие цели. Я буду стараться работать так, что каждый мой последующий час принесет мне больше, чем предыдущий.", "И я всегда буду громко говорить о своих планах. Но никогда, ни единым словом я не обмолвлюсь о том, чего смог достичь, в чем преуспел. Мир сам должен увидеть и признать мои заслуги. И если кто-то станет хвалить меня или ставить в пример, то дай мне Бог принять заслуженное с предельной скромностью.", "Сегодня я увеличу свою ценность в сотню раз. Из одного пшеничного зерна может появиться столько зерен, что ими можно заполнить все хранилища мира. Разве я меньше этого зерна? Я больше его.", "Сегодня я увеличу свою ценность в сотню раз. И никогда я не остановлюсь на достигнутом, поскольку только так, постоянно совершенствуясь, впитав в себя мудрость этих свитков, я смогу удивить мир своим величием."], "sha256": "2554aa98f6c9582f499da356a990e0c0e4d8831e7c028a992fd95123f08dff13"}, {"id": 9, "title": "Свиток 9", "pages": "46–47", "blocks": ["Мои мечты — грязь, мои планы — пыль, а мои цели недостижимы. Ничто не имеет цены до тех пор, пока не подтверждается делами.", "Действовать я начну сегодня же, немедленно. В мире есть много географических карт, красочных и детальных, но ни одна из них не способна перенести человека хоть на дюйм. Есть и множество законов, но, при всей их справедливости, никакой закон не может предотвратить ни одного преступления. Нет в мире такого текста, который, сколь бы мудр он ни был, заработал хотя бы грош или вызвал у слушателей взрыв восторга. Дело — вот что должно двигать человеком, дело должно стоять за картой; на него, на дело, должен опираться закон. И не свитками, а делом богатеет человек. Дело превратит мои планы, цели и мечты в реальность. Дело — вода и пища успеха, к которому я стремлюсь.", "И действовать я начну сегодня же, немедленно. Моя нерешительность, медлительность — вот, что сдерживает меня. Они порождены страхом. Но отныне мне известна тайна, которую из глубины веков донесли мне мужественные сердца. Теперь я знаю, что побороть страх можно только делом. Я буду действовать без промедления и избавлюсь от страха. Делом можно уменьшить преграды и лишить себя боязни. Своими делами я превращу льва страха в муравья невозмутимости.", "И действовать я начну сегодня же, немедленно. Отныне я буду всегда помнить урок, преподанный мне светлячком, который светит только в полете. Я стану светлячком, и свет мой увидят даже днем, ибо он будет ярче солнечных лучей. И пока другие будут бабочками, что хоть и летают, но зависят от милости цветов, я буду светлячком, и мир увидит мой свет.", "И действовать я начну сегодня же, немедленно. Я не стану откладывать сегодняшние дела на завтра, поскольку, кто знает, будет ли еще для меня завтра. Действовать я начну сегодня, и неважно, принесет ли мне моя работа счастье и успех. Я буду просто работать, чтобы никто не смел сказать мне, что я — бездельник, ни на что не годный. А счастье, кстати сказать, достигается трудом. Счастье — это плод, который без ухода, без дел, погибнет.", "И действовать я начну сегодня же, немедленно. Действовать сейчас же, сейчас же, сейчас же. Действовать! Отныне я буду неустанно повторять эти слова. Я буду повторять их каждый день, каждый час, пока они не войдут в мои плоть и кровь. Они станут для меня частью жизни, такой как дыхание. Действовать! Труд должен стать для меня потребностью. Как не могут веки не моргать, так и я не могу не трудиться. Постоянно подталкивая себя к труду, я подготовлю себя к любому препятствию, и оно не испугает меня. Своим трудом я бросаю вызов всем преградам на свете. И я преодолею их, потому что роль неудачника — не для меня.", "И действовать я начну сегодня же, немедленно. Снова и снова я буду повторять эти слова. Утром я произнесу их прежде, чем встану с постели. Пусть неудачник еще поспит, я же буду работать.", "И действовать я начну сегодня же, немедленно. Когда я приду к себе в лавку, я сразу же начну работать, предлагать свой товар. И меня не напугает отказ купить мой товар, я все равно буду продолжать работать.", "Действовать я начну сегодня же, немедленно. Подойдя к закрытой двери, я без страха постучусь в нее, даже если буду твердо знать, что меня поджидает неудача.", "Действовать я начну сегодня же, немедленно. Если я наткнусь на соблазн, я тут же отведу от него глаза свои, поскольку знаю — стоит только поддаться соблазну и все мои мечты рухнут.", "Действовать я начну сегодня же, немедленно. Если я устану и захочу бросить на сегодня работу, а начать ее завтра, я заставлю себя продолжать. Я сразу же дам себе слово, что не перестану сегодня работать, пока не совершу еще одну сделку.", "Действовать я начну сегодня же, немедленно. Ценность моя определяется моими делами. Умножаются мои дела — увеличивается моя ценность. И я увеличу свои дела, я буду ходить там, куда не заходит даже неудача. Я буду беспрестанно трудиться, и неудача устанет бежать за мной. Я буду говорить там, где молчит даже неудача. Если неудача подстережет меня в одном месте, я пойду в десять других, и она не поспеет за мной. Я успею совершить сделку прежде чем неудача начнет мне нашептывать, что я опоздал.", "Действовать я начну сегодня же, немедленно. Потому что сегодня — это все, что у меня есть. Завтра я оставляю лентяям. Я же не лентяй. Завтра и зло может стать добром, но я — не зло. Завтра и слабый станет сильным, но я не слаб. Завтра и неудачник может преуспеть, но я преуспею сегодня, потому что я — не неудачник.", "И действовать я начну сегодня же, немедленно. Когда лев голоден, он ест, когда орла мучит жажда, он летит к воде. Звери действуют, потому что они хотят выжить. Меня тоже мучат голод и жажда, я жажду успеха, счастья и спокойствия. Но только делом я избавлю себя от бедности, слез жалости к себе и страшных бессонных ночей.", "Я научился властвовать собой и выполнять свои приказы. И действовать я начну сегодня же, немедленно."], "sha256": "82c92bc79c7e0be85c5630b3fafcd1a0df3bc7bea0a48124a25486a8f16b23e4"}, {"id": 10, "title": "Свиток 10", "pages": "48–49", "blocks": ["Есть ли среди нас хоть один человек, который, когда постигнет его беда или несчастье, не призвал бы на помощь Бога? Кто не воззовет к Всевышнему, когда встретится с горем, смертью, несчастьем или иным проявлением силы, неподвластной нам и недоступной нашему пониманию? Призыв и мольба — древние, глубокие инстинкты, и никто не знает, откуда пришли они. Но не было еще такого человека, который, столкнувшись со страшным горем, не обратился бы к Богу.", "Если ты станешь махать руками перед лицом человека, он заморгает. Стукни по коленной чашечке, и нога дернется. Скажи кому-нибудь страшную новость, и он воскликнет: “О, Господи!”. Почему? Тот же древний инстинкт движет его речью и чувствами. Даже не очень религиозный человек признает, что в тяжкую минуту мы все непроизвольно зовем на помощь Бога. И это — одна из тайн нашей жизни. Все живое, включая человека, в трудный час зовет на помощь. Это — инстинкт. Но зачем дан этот дар нам? Не являются ли наши непроизвольные восклицания своего рода молитвой? Но неужели природа так глупа, что, дав этот инстинкт и зверю, и птице, и человеку, не позаботилась о том, чтобы призыв о помощи, обращенный к высшему существу, не был бы услышан? Отныне я стану молиться, но просить буду только совета. Я не стану просить у Всевышнего материальных благ, ибо я не хозяин, чтобы приказывать своему рабу подать мне то или другое. Я не буду просить ниспослать мне золота или чьей-либо любви, больших побед или мелочных успехов, здоровья или счастья. Только об одном я стану молить Бога — дать мне совет, вразумить меня, как мне следует поступить, чтобы достичь всего, что я хочу. И я уверен — на свою просьбу я получу ответ. Я буду просить Господа указать мне путь, и Он может указать его мне, а может и — нет. Но и во втором случае это тоже ответ на мой вопрос. Если ребенок просит у отца дать ему хлеба, но не получает его, разве это не ответ?", "Я стану молиться, испрашивая в молитве совета, как поступить. Молитва моя будет такой: О, Создатель всего живущего, помоги мне, ибо бедным и одиноким вступаю я в этот мир. И нет руки, кроме Твоей, чтобы повела меня за собой. Веди меня, ибо без Твоей помощи я буду блуждать в потемках и никогда не найду дороги к счастью и успеху.", "Не золота и дорогих одежд прошу я у Тебя, также не прошу я и дать мне возможности раскрыть свои способности. Прошу я у Тебя лишь одного — веди меня так, чтобы я мог приобрести по способностям.", "Льва и орла Ты научил добывать себе пищу клыками и когтями. Научи же и меня, как охотиться словами и преуспеть с любовью, дабы я стал львом среди людей и орлом в своей работе.", "Помоги мне оставаться скромным, ставь передо мной преграды, дабы я не возгордился, но и не отводи от глаз моих тех радостей, что приходят с победой.", "Дай мне делать то, что не под силу другим, но веди меня так, чтобы я собрал семена удачи там, где другие не обнаружили их. Нашли на меня страхи, которые станут искушать дух мой, но и дай мне силы преодолеть их и посмеяться над своими несчастьями.", "Да не оскудеет рука Твоя; отведи мне дней столько, сколько нужно для достижения успеха, но и помоги мне прожить день сегодняшний так, словно он — мой последний.", "Веди меня в речах моих так, чтобы они приносили мне плоды успеха, но если я захочу", "посрамить или унизить кого-нибудь, то сомкни уста мои.", "Дай мне силы и упорства и научи меня, как мне обратить в свою пользу закон средних величин. Награди меня деловым чутьем, дабы я смог увидеть свои возможности, а также терпением и умением концентрировать свои силы.", "Отведи от меня дурные привычки, а добрые сделай моим поведением. Дай мне сострадания к больным и слабым, пошли мне страдания, дабы я узнал, что все проходит, но даруй мне на сегодня милость свою.", "Сделай так, чтобы меня ненавидели, но мою чашу наполни любовью, чтобы я мог дать ее ненавидящим меня и сделать их своими друзьями.", "Если хочешь, сделай так, как я прошу Тебя. Я — малая из виноградин в саду Твоем, но по воле Твоей я отличаюсь от других. Воистину я достоин того положения, к которому стремлюсь. Так веди же меня.", "Помоги мне. Господи, укажи путь. Дай мне выполнить все те планы, что Ты возложил на меня, когда дал созреть виноградине моей в саду Твоем.", "Господи, помоги мне, ничтожному торговцу. Веди меня!"], "sha256": "22bfbb104a1a7836f2eefb5bacfecd2922b46a5129b5d567edb1b5f1486b8cda"}];
let current=Math.min(Math.max(Number(localStorage.getItem('mandino-scroll')||1),1),10);
let font=Math.min(Math.max(Number(localStorage.getItem('mandino-font')||20),16),30);
let theme=localStorage.getItem('mandino-theme')||'light';
const $=s=>document.querySelector(s), nav=$('#nav'), mobile=$('#mobileNav'), content=$('#content');
document.documentElement.dataset.theme=theme; document.documentElement.style.setProperty('--fs',font+'px');
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isRefrain(t){return /^(И?\s*с любовью|Сегодня я|И я буду|Я буду настойчив|Я — величайшее|Я проживу|Я посмеюсь|Действовать|И действовать|Я стану хозяином)/.test(t)}
function renderText(blocks,q=''){
 let out='', inList=false; const needle=q.trim().toLocaleLowerCase('ru');
 const mark=t=>{let e=esc(t); if(!needle) return e; const low=t.toLocaleLowerCase('ru'); let i=0,pos=0,res=''; while((i=low.indexOf(needle,pos))>-1){res+=esc(t.slice(pos,i))+'<mark class="hit">'+esc(t.slice(i,i+needle.length))+'</mark>'; pos=i+needle.length} return res+esc(t.slice(pos))};
 for(const b of blocks){if(b.startsWith('• ')){if(!inList){out+='<ul>';inList=true}out+='<li>'+mark(b.slice(2))+'</li>'}else{if(inList){out+='</ul>';inList=false} out+='<p class="'+(isRefrain(b)?'refrain':'')+'">'+mark(b)+'</p>'}} if(inList)out+='</ul>'; return out;
}
function renderNav(){nav.innerHTML='';mobile.innerHTML=''; for(const s of scrolls){const b=document.createElement('button');b.innerHTML='Свиток '+s.id+'<small>стр. '+s.pages+'</small>'; b.className=s.id===current?'active':''; b.onclick=()=>go(s.id);nav.appendChild(b); const m=document.createElement('button');m.textContent='Свиток '+s.id;m.className=s.id===current?'active':'';m.onclick=()=>go(s.id);mobile.appendChild(m)}}
function render(){const s=scrolls[current-1]; $('#label').textContent='Свиток '+s.id; $('#title').textContent=s.id===1?'Сегодня я начинаю новую жизнь.':'Свиток '+s.id; $('#pages').textContent='Страницы источника: '+s.pages; content.innerHTML=renderText(s.blocks,$('#search').value); $('#prev').disabled=current===1;$('#next').disabled=current===10; renderNav(); localStorage.setItem('mandino-scroll',current); requestAnimationFrame(updateProgress)}
function go(n){current=n; $('#search').value=''; render(); window.scrollTo({top:0,behavior:'smooth'})}
$('#prev').onclick=()=>current>1&&go(current-1); $('#next').onclick=()=>current<10&&go(current+1);
$('#plus').onclick=()=>{font=Math.min(30,font+1);document.documentElement.style.setProperty('--fs',font+'px');localStorage.setItem('mandino-font',font)};
$('#minus').onclick=()=>{font=Math.max(16,font-1);document.documentElement.style.setProperty('--fs',font+'px');localStorage.setItem('mandino-font',font)};
$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;localStorage.setItem('mandino-theme',theme)};
$('#searchBtn').onclick=()=>{$('#searchWrap').classList.toggle('open'); if($('#searchWrap').classList.contains('open'))$('#search').focus()}; $('#search').oninput=render;
function updateProgress(){const d=document.documentElement;const max=d.scrollHeight-innerHeight;$('#progress').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'} addEventListener('scroll',updateProgress,{passive:true}); addEventListener('resize',updateProgress);
render();
</script>
</body></html>
